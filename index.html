<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a855f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="oec.fyi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>oec.fyi | OEC practice</title>
    <meta
      name="description"
      content="Unofficial Outdoor Emergency Care practice: all questions with answers shown immediately, a chapter's questions with the correct answer marked, or a practice test of 10 to 100 questions."
    />
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function () {
        var choice = "system";
        try {
          var stored = localStorage.getItem("oec-theme");
          if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
        } catch (e) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#16121f" : "#a855f7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

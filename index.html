<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16121f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="oec.fyi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>oec.fyi | OEC practice</title>
    <meta
      name="description"
      content="Unofficial Outdoor Emergency Care practice: all questions with answers shown immediately, a chapter's questions with the correct answer marked, or a practice test of 10 to 100 questions."
    />
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("oec-theme") !== "dark") localStorage.setItem("oec-theme", "dark");
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", "dark");
        root.style.colorScheme = "dark";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#16121f");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
